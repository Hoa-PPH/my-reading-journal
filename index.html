<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap">
<style>
:root{--bg:#f3ede1;--paper:#fbf8f1;--ink:#2a251f;--mut:#80766a;--line:#e4dac7;--acc:#9c4a2f;--onacc:#fff;--soft:#f0ddd2;--green:#3d6b57;--amber:#b07a1f;
 --serif:Lora,Georgia,"Iowan Old Style",Palatino,serif;--sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#161411;--paper:#211e19;--ink:#ede6d9;--mut:#9d9487;--line:#363028;--acc:#e0a07f;--onacc:#2a1a10;--soft:#3a2a22;--green:#8fc0a8;--amber:#e1b866}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
header,main{max-width:680px;margin-inline:auto;padding-inline:18px}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:2px 16px;padding-block:12px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.brand{font:700 1.3rem var(--serif);color:var(--ink);text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:12px;height:20px;background:var(--acc);clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)}
nav a{color:var(--mut);text-decoration:none;padding:8px 12px;border-radius:99px;font-weight:500;display:inline-block}
nav a[aria-current]{color:var(--acc);background:var(--soft)}
#status{width:100%;font-size:.78rem;color:var(--mut);display:flex;align-items:center;gap:7px}
#status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mut)}
#status[data-state=synced]::before{background:var(--green)}#status[data-state=syncing]::before{background:var(--amber)}#status[data-state=error]::before{background:#c0392b}
main{padding-block:6px 40px}
h1,h2{font-family:var(--serif);line-height:1.2;margin:0}h1{font-size:1.85rem}h2{font-size:1.1rem;margin:24px 0 8px}
a{color:var(--acc)}.mut{color:var(--mut)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
input,select,textarea,button,.btn{font:inherit;color:inherit;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 14px;min-height:44px}
button,.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;font-weight:500}
.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.seg{display:flex;gap:2px;background:var(--line);border-radius:14px;padding:3px;overflow-x:auto;margin:6px 0 14px}
.seg .chip{flex:1;white-space:nowrap;border:0;background:transparent;border-radius:11px;min-height:38px;padding:6px 12px;color:var(--mut)}
.seg .chip.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(60,40,20,.18)}
.list{list-style:none;padding:0;margin:0}
.card{display:flex;gap:14px;padding:14px;margin:10px 0;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:inherit;text-decoration:none;box-shadow:0 8px 18px -14px rgba(60,40,20,.5);transition:transform .15s}
.card:active{transform:scale(.99)}@media (hover:hover){.card:hover{transform:translateY(-2px)}}
.tile{flex:none;width:54px;height:76px;border-radius:3px 7px 7px 3px;display:grid;place-items:center;color:#fff;font:700 1.6rem var(--serif);
 background:linear-gradient(140deg,hsl(var(--h) 42% 46%),hsl(var(--h) 46% 30%));box-shadow:inset 5px 0 0 rgba(0,0,0,.22),2px 4px 8px rgba(0,0,0,.25)}
.info{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1;justify-content:center}.info b{font:600 1.05rem var(--serif);overflow-wrap:anywhere}.info small{font-size:.82rem}
.badge{align-self:flex-start;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--mut)}
.b-reading{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}.b-want{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green)}
.empty{text-align:center;padding:48px 16px;color:var(--mut);border:1.5px dashed var(--line);border-radius:18px;margin-top:10px}.empty .big{font:600 1.2rem var(--serif);color:var(--ink);margin:0 0 6px}
.hint{background:var(--soft);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:.9rem}
.form label{display:block;margin:14px 0}.form label>span{display:block;font-size:.82rem;font-weight:500;color:var(--mut);margin-bottom:5px}
.form input,.form select,.form textarea{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
blockquote{position:relative;margin:10px 0;padding:14px 18px 14px 44px;background:var(--paper);border:1px solid var(--line);border-radius:14px;font:italic 500 1.05rem/1.6 var(--serif)}
blockquote::before{content:"\201C";position:absolute;left:14px;top:2px;font:700 2.6rem var(--serif);color:var(--acc)}
.notes-soon{margin:22px 0;padding:22px;text-align:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:16px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:720px){
 nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
 nav a{flex:1;text-align:center;padding:12px 0}main{padding-bottom:100px}
}
</style></head>
<body>
<header>
  <a class="brand" href="#/" data-i18n="app"></a>
  <nav><a href="#/" data-i18n="nav.library"></a><a href="#/settings" data-i18n="nav.settings"></a></nav>
  <span id="status"></span>
</header>
<main id="app"></main>
<script type="module" src="js/app.js"></script>
</body></html>
