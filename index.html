<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e9f9a"><title>Reading Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;--bg:#f4efe9;--paper:#fffdfb;--ink:#2d2824;--mut:#8a7f75;--line:#e8dfd5;
 --teal:#0e9f9a;--teal-d:#0a6f6c;--teal-s:#dcf2ef;--pink:#e58aa5;--pink-d:#b4456a;--pink-s:#fbe4eb;--brown:#a77b57;--brown-s:#f1e5d8;
 --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in,main{max-width:1040px;margin-inline:auto;padding-inline:18px}
.bar-in{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px;padding-block:10px 6px}
.brand{font-weight:700;font-size:1.15rem;color:var(--ink);text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand::before{content:"";width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--pink))}
nav a{color:var(--mut);text-decoration:none;padding:8px 14px;border-radius:10px;font-weight:500;display:inline-block}
nav a[aria-current]{color:var(--teal-d);background:var(--teal-s)}
#status{width:100%;font-size:.76rem;color:var(--mut);display:flex;align-items:center;gap:7px;padding-bottom:4px}
#status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mut)}
#status[data-state=synced]::before{background:var(--teal)}#status[data-state=syncing]::before{background:var(--brown)}#status[data-state=error]::before{background:#d64545}
main{padding-block:18px 48px}
h1{font-size:1.6rem;line-height:1.25;margin:0;font-weight:700}h2{font-size:1rem;margin:24px 0 8px;font-weight:600}
a{color:var(--teal-d)}.mut{color:var(--mut)}
.narrow{max-width:640px}
input,select,textarea,button,.btn{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:9px 13px;min-height:42px}
button,.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;font-weight:500}
.p{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.7rem;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}.stat span{font-size:.74rem;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.tools input[type=search]{flex:1 1 200px}
.seg{display:flex;gap:2px;background:var(--brown-s);border-radius:12px;padding:3px;overflow-x:auto}
.seg .chip{white-space:nowrap;border:0;background:transparent;border-radius:9px;min-height:36px;padding:5px 12px;color:var(--brown)}
.seg .chip.on{background:var(--paper);color:var(--teal-d);font-weight:600;box-shadow:0 1px 3px rgba(80,50,20,.15)}
.table{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.trow,.thead{display:grid;grid-template-columns:40px minmax(0,1fr) 80px 104px 150px 92px;gap:14px;align-items:center;padding:10px 16px}
.thead{background:var(--brown-s);color:var(--brown);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-block:8px}
.trow{border-top:1px solid var(--line);color:inherit;text-decoration:none}@media (hover:hover){.trow:hover{background:var(--teal-s)}}
.tile{width:34px;height:46px;border-radius:3px 6px 6px 3px;display:grid;place-items:center;color:#fff;font-weight:700;
 background:linear-gradient(140deg,hsl(var(--h) 45% 54%),hsl(var(--h) 50% 38%));box-shadow:inset 4px 0 0 rgba(0,0,0,.18),1px 2px 4px rgba(0,0,0,.2)}
.ttl{min-width:0}.ttl b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ttl small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{font-size:.85rem;color:var(--mut)}
.badge{justify-self:start;font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--mut)}
.b-reading{background:var(--teal-s);color:var(--teal-d)}.b-want{background:var(--brown-s);color:var(--brown)}.b-done{background:var(--pink-s);color:var(--pink-d)}
.prog{display:flex;align-items:center;gap:8px}.prog small{font-variant-numeric:tabular-nums;color:var(--mut);min-width:34px}
.bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.b-done~.prog .bar i{background:var(--pink)}
.empty{text-align:center;padding:44px 16px;color:var(--mut)}.empty .big{font-weight:600;font-size:1.1rem;color:var(--ink);margin:0 0 6px}
.hint{background:var(--pink-s);color:var(--pink-d);border-radius:10px;padding:9px 14px;margin:0 0 14px;font-size:.9rem}.hint a{color:inherit;font-weight:600}
.form label{display:block;margin:14px 0}.form label>span{display:block;font-size:.8rem;font-weight:500;color:var(--mut);margin-bottom:5px}
.form input,.form select,.form textarea{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
blockquote{margin:10px 0;padding:14px 18px;background:var(--pink-s);border-left:4px solid var(--pink);border-radius:0 12px 12px 0;font-size:1.02rem}
.notes-soon{margin:22px 0;padding:22px;text-align:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:14px}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (max-width:720px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .thead,.hm{display:none}.trow{grid-template-columns:40px minmax(0,1fr) auto}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
 nav a{flex:1;text-align:center;padding:11px 0}main{padding-bottom:100px}
}
</style></head>
<body>
<header><div class="bar-in">
  <a class="brand" href="#/" data-i18n="app"></a>
  <nav><a href="#/" data-i18n="nav.library"></a><a href="#/settings" data-i18n="nav.settings"></a></nav>
  <span id="status"></span>
</div></header>
<main id="app"></main>
<script type="module" src="js/app.js"></script>
</body></html>
